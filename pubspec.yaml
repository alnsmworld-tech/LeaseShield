name: lease_shield
description: "LeaseShield — Privacy-first rental agreement analyzer powered by Firebase AI Logic Hybrid Inference."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3

  # Firebase Stack
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_app_check: ^0.3.2+5
  firebase_remote_config: ^5.4.2

  # OCR, Media, Connectivity & Sharing
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.3
  share_plus: ^10.1.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
